name: Build and test

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  NUGET_XMLDOC_MODE: skip

jobs:
  build:
    name: Build, test, package, and AOT (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            executable: TheLithium.Imprint.Specifications.exe
          - os: ubuntu-latest
            rid: linux-x64
            executable: TheLithium.Imprint.Specifications
          - os: macos-latest
            rid: osx-arm64
            executable: TheLithium.Imprint.Specifications
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore TheLithium.Imprint.slnx --force-evaluate
      - name: Build
        run: dotnet build TheLithium.Imprint.slnx -c Release --no-restore
      - name: Verify formatting
        run: dotnet format TheLithium.Imprint.slnx whitespace --no-restore --verify-no-changes
      - name: Test project references
        run: dotnet test TheLithium.Imprint.slnx -c Release --no-build --no-restore --logger trx --results-directory artifacts/test-results
      - name: Pack local feed
        run: dotnet pack TheLithium.Imprint.slnx -c Release --no-build --no-restore
      - name: Restore package consumers
        run: dotnet restore TheLithium.Imprint.slnx -p:UsePackageReferences=true -p:RestorePackagesPath=artifacts/nuget/package-consumer --force-evaluate
      - name: Test package consumers
        run: dotnet test TheLithium.Imprint.slnx -c Release -p:UsePackageReferences=true -p:RestorePackagesPath=artifacts/nuget/package-consumer --no-restore --logger trx --results-directory artifacts/package-test-results
      - name: Run executable specifications
        run: dotnet run --project tests/TheLithium.Imprint.Specifications -c Release -p:UsePackageReferences=true -p:RestorePackagesPath=artifacts/nuget/package-consumer --no-build --no-restore
      - name: Publish package consumer as Native AOT
        run: dotnet publish tests/TheLithium.Imprint.Specifications -c Release -r ${{ matrix.rid }} -p:UsePackageReferences=true -p:RestorePackagesPath=artifacts/nuget/package-consumer -p:PublishAot=true -p:SelfContained=true -o artifacts/native/${{ matrix.rid }}
      - name: Run native specifications
        run: ./artifacts/native/${{ matrix.rid }}/${{ matrix.executable }} --expect-aot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.rid }}
          path: |
            artifacts/test-results
            artifacts/package-test-results
            artifacts/packages

  xunit:
    name: xUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore TheLithium.Imprint.slnx --force-evaluate
      - name: Test xUnit suites
        run: |
          dotnet test tests/TheLithium.Imprint.Tests/TheLithium.Imprint.Tests.csproj -c Release --no-restore --logger trx --results-directory artifacts/test-results/xunit
          dotnet test tests/TheLithium.Imprint.Generator.Tests/TheLithium.Imprint.Generator.Tests.csproj -c Release --no-restore --logger trx --results-directory artifacts/test-results/xunit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-xunit
          path: artifacts/test-results/xunit

  nunit:
    name: NUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore tests/TheLithium.Imprint.NUnit.Tests/TheLithium.Imprint.NUnit.Tests.csproj --force-evaluate
      - name: Test NUnit suite
        run: dotnet test tests/TheLithium.Imprint.NUnit.Tests/TheLithium.Imprint.NUnit.Tests.csproj -c Release --no-restore --logger trx --results-directory artifacts/test-results/nunit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-nunit
          path: artifacts/test-results/nunit

  mstest:
    name: MSTest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore tests/TheLithium.Imprint.MSTest.Tests/TheLithium.Imprint.MSTest.Tests.csproj --force-evaluate
      - name: Test MSTest suite
        run: dotnet test tests/TheLithium.Imprint.MSTest.Tests/TheLithium.Imprint.MSTest.Tests.csproj -c Release --no-restore --logger trx --results-directory artifacts/test-results/mstest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-mstest
          path: artifacts/test-results/mstest
